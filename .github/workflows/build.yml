name: Build Geode Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode SDK
        uses: geode-sdk/install-geode-sdk@main
        with:
          geode: v4.0.0

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64
